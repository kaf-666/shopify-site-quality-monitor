default_site: mondressy_US
screenshot_suffix: _playwright
results_file: reports/visual-results.json
paths:
  baseline_root: baselines
  artifact_root: artifacts
  legacy_screenshot_root: screenshots
  legacy_baseline_fallback: true
artifacts:
  screenshot_retention:
    mode: standard
    keep_passed: false
    keep_content_changed: false
    keep_warning: true
    keep_failed: true
    keep_initialized: true
    generate_diff_for_passed: false
    generate_diff_for_content_changed: false
    generate_diff_for_warning: true
    generate_diff_for_failed: true
    keep_context_on_failure:
      global: true
      first_screen: true
    limits:
      max_images_per_page: 12
      max_mb_per_page: 50
      max_mb_per_site: 200
      max_mb_per_run: 1000
    cleanup:
      remove_temp_on_success: true
      remove_temp_on_failure: true
ci:
  allow_baseline_init: false
  strict_warnings: false
suites:
  visual_readonly: true
  side_effect_flows: false
side_effects:
  enabled: false
browser:
  channel: chrome
  headed: true
run_viewports:
  - desktop
  - mobile
viewports:
  desktop:
    width: 1600
    height: 4000
    device_scale_factor: 1
    is_mobile: false
    has_touch: false
  mobile:
    width: 390
    height: 844
    device_scale_factor: 2
    is_mobile: true
    has_touch: true
    user_agent: "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36"
visual:
  change_threshold: 0.005
  warning_threshold: 0.02
  screenshot_policy:
    default_purpose: gate
    pages:
      home:
        global:
          purpose: report_only
          report_case: home_full_page
        first_screen:
          purpose: gate
          report_case: home_first_screen
        mobile_menu_open:
          purpose: gate
          viewports:
            - mobile
        header_1: structure_only
        header_2: structure_only
        banner: structure_only
        collections: structure_only
        collections_1: structure_only
        user_btn: structure_only
        cart_btn: structure_only
        search_btn: structure_only
        wishlist: structure_only
        currency: structure_only
      collection:
        global:
          purpose: report_only
          report_case: collection_full_page
        first_screen:
          purpose: gate
          report_case: collection_first_screen
        filter_open:
          purpose: gate
          viewports:
            - desktop
        filter_drawer_open:
          purpose: gate
          viewports:
            - mobile
        product_grid: structure_only
        filter: structure_only
        pagination: structure_only
      product:
        global:
          purpose: report_only
          report_case: product_full_page
        first_screen:
          purpose: gate
          report_case: product_first_screen
        product_main: gate
        variant_changed_state: gate
        sticky_add_to_cart:
          purpose: evidence_only
          viewports:
            - mobile
        gallery: structure_only
        info: structure_only
        add_to_cart: structure_only
        variant_0: structure_only
        variant_1: structure_only
        variant_2: structure_only
  structure_regions:
    home:
      - name: banner
        module: banner
        strategy: layout_only
        region_type: content
      - name: collections
        module: collections
        strategy: layout_only
        region_type: category_carousel
      - name: collections_1
        module: collections_1
        strategy: layout_only
        region_type: product_carousel
    collection:
      - name: product_grid
        module: product_grid
        strategy: layout_only
        region_type: product_grid
    product:
      - name: gallery
        module: gallery
        strategy: layout_only
        region_type: product_media
      - name: info
        module: info
        strategy: layout_only
        region_type: product_information
  stabilize_timeout: 10
  width_tolerance_px: 0
  # Shopify 页尾与异步区块偶发产生少量高度漂移；超过 25px 仍按结构变化失败。
  height_tolerance_px: 25
  alignment_tolerance_px: 1
  alignment_max_pixels: 5000000
  perceptual_fallback_enabled: true
  perceptual_blur_radius: 1.75
  perceptual_band_height_px: 120
  perceptual_alignment_tolerance_px: 6
  perceptual_max_pixels: 5000000
  # 超长全页图超过模糊比较的内存预算时，用分块亮度结构指纹识别 CDN 重编码。
  large_image_structural_fallback_enabled: true
  structural_tile_size_px: 128
  structural_hash_distance_threshold: 0.13
  structural_changed_tile_fraction_threshold: 0.15
runtime_health:
  enabled: true
  reporting:
    report_only: true
    affect_exit_code: false
    fail_on_failed: true
    fail_on_warning: false
  retry_policy:
    recovered_status: warning
  max_events_per_category: 100
  http_error_status: 400
  blank_page_text_threshold: 30
  blank_page_node_threshold: 20
  loading_confirmation_ms: 1000
  loading_selectors:
    - "[aria-busy='true']"
  loading_critical_selectors: []
  critical_selectors: []
  optional_selectors: []
  first_party_patterns: []
  third_party_patterns: []
  network_noise:
    ignore_third_party_aborted: true
    ignore_image_aborted: true
    ignore_favicon: true
  legitimate_empty_patterns:
    - "no products found"
    - "no results"
    - "sold out"
    - "your cart is empty"
  error_page_patterns: {}
health_check:
  enabled: true
  report:
    json: true
    html: true
    output_dir: reports
  ai:
    enabled: false
    provider: none
    max_findings: 20
    max_evidence_per_finding: 8
    self_healing:
      suggestions_only: true
      approval_required: true
      auto_apply: false
  false_positive_control:
    minimum_critical_alert_evidence: HIGH
    suppress_third_party_noise: true
    suppress_expected_change: true
    suppress_selector_change: true
    recovered_retry_status: FLAKY
    blocked_requires_repeated_confirmation: true
  interaction_policy:
    allowed_levels:
      - SAFE
    transactional_requires_explicit_opt_in: true
    high_risk_allowed: false
    capability_overrides: {}
  shadow_executor:
    enabled: false
    timeout_ms: 10000
    max_retries: 0
    retry_delay_ms: 0
    retry_on_timeout: true
    retry_on_error: false
    history:
      enabled: true
      root: history
    maturity:
      overall_coverage_percent: 80
      critical_coverage_percent: 90
      executable_coverage_percent: 80
      result_parity_percent: 98
      evidence_parity_percent: 95
      max_policy_regressions: 0
      max_executor_errors: 0
      max_executor_timeouts: 0
      required_consecutive_stable_runs: 10
      require_result_parity_sample: true
      require_evidence_parity_sample: true
