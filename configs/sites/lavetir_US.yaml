site: lavetir_US
base_url: https://www.lavetir.com

browser:
  headed: true

global_screenshot_height_strategy: baseline
global_screenshot_scroll_passes: 3
global_screenshot_height_stable_checks: 4

screenshot_css:
  - |
    .wt-announcement__body,
    .slideshow__slide {
      animation: none !important;
      transition: none !important;
    }
    .slideshow-section .swiper-wrapper {
      transition-duration: 0ms !important;
      transform: none !important;
    }
    .slideshow-section .swiper-pagination-bullet {
      opacity: 0.2 !important;
    }
    .slideshow-section .swiper-pagination-bullet:first-child {
      opacity: 1 !important;
    }

dynamic_hide:
  exclude_selectors:
    - ".price"
  selectors:
    - ".sale-badge"
    - ".spr-badge"
    - "#size_error"
    - ".alr-wh-rw-popup"
    - ".cbb-frequently-bought-container"
    - "[id*='cbb']"
    - "[class*='cbb']"
    - "[id*='frequently']"
    - "[class*='frequently']"
    - "[id*='bought']"
    - "[class*='bought']"
    - ".shopify-payment-button"
    - ".shopify-payment-button__button"
    - "[data-shopify='payment-button']"
    - "shopify-payment-terms"
  text_exact:
    - frequently bought together
    - more payment options
    - buy it now
  text_contains:
    - pay with paypal

access_denied_patterns:
  - 正在进行安全验证
  - Cloudflare Ray ID

pages:
  home:
    url: https://www.lavetir.com/
    capture_global_screenshot: true
    capture_first_screen: true
    stable_display:
      - selector: ".wt-announcement__body"
        index: 0
        display: flex
        wrapper_selector: ".wt-announcement__container"
      - selector: "section.slideshow-section .swiper-slide:not(.swiper-slide-duplicate)"
        index: 0
        display: block
        wrapper_selector: "section.slideshow-section .swiper-wrapper"
    first_screen_clip:
      x: 0
      y: 0
      width: 1600
      height: 900
    expected_keywords:
      - lavetir
    modules:
      header_1:
        - css
        - "section.wt-announcement"
      header_2:
        - css
        - ".wt-header__aside"
      banner:
        - css
        - "section.slideshow-section"
      collections:
        - css
        - "section.wt-multicol__section"
      collections_1:
        - css
        - "section[id*='__featured_collection_']"
      user_btn:
        - css
        - ".wt-header__panel__link[href='/account']"
      cart_btn:
        - css
        - ".wt-header__panel__link[href='/cart']"
      search_btn:
        - css
        - ".wt-header__search-trigger"
    mobile:
      first_screen_clip:
        x: 0
        y: 0
        width: 390
        height: 844
      modules:
        header_2:
          - css
          - ".wt-header__panel"

  collection:
    url: https://www.lavetir.com/collections/mother-of-the-bride-dresses
    capture_global_screenshot: true
    capture_first_screen: true
    expected_keywords:
      - mother
      - bride
    expected_count: 35
    modules:
      product_grid:
        - css
        - "#product-grid"
      filter:
        - css
        - ".collection__sticky-header"
      pagination:
        - css
        - ".wt-pagination-wrapper"
    product_card:
      - css
      - "#product-grid .card__container"
    stable_card_media:
      selector: "img"
      default_index: 0
      hover_index: 0
    desktop:
      first_screen_clip:
        x: 0
        y: 0
        width: 1600
        height: 900

  product:
    url: https://www.lavetir.com/collections/mother-of-the-bride-dresses/products/lace-chiffon-square-neck-3-4-sleeves-3-pieces-pantsuits-with-appliques-jacket-22441666
    capture_global_screenshot: true
    capture_first_screen: true
    expected_keywords:
      - lace
      - chiffon
    require_reviews: false
    modules:
      gallery:
        - css
        - "media-gallery, .product__media-wrapper, [class*='gallery'], [class*='product__photos'], [class*='product-media']"
      info:
        - css
        - ".product__info-wrapper, .product-single__meta, [class*='product-info'], [class*='product__info']"
      add_to_cart:
        - css
        - "form[action*='/cart/add'] button[name='add'], button[name='add'], [type='submit'][name='add']"
    variant_inputs:
      - css
      - "variant-radios input, variant-selects select, .product-form__input input, [class*='variant'] input"
    desktop:
      first_screen_clip:
        x: 0
        y: 0
        width: 1600
        height: 900
    mobile:
      reload_before_module_capture: true
