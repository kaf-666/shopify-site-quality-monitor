        width: 1600
        height: 900
    mobile:
      dom_presence:
        hidden_mega_menu:
          - css
          - ".gm-submenu"
      screenshot_css:
        - |
          #main-collection-product-grid .product-index .sale-item--percentage {
            padding: 3px 6px !important;
            font-size: 10px !important;
            line-height: 18px !important;
          }
          #main-collection-product-grid .product-index .sale-item--percentage .icn__inner {
            font-size: 10px !important;
            line-height: 18px !important;
          }
          #main-collection-product-grid .product-index .swatch-lightning__tip {
            padding: 3px 5px !important;
            font-size: 8px !important;
            line-height: 8.8px !important;
          }
          #main-collection-product-grid .product-index .swatch-lightning__tip-text,
          #main-collection-product-grid .product-index .swatch-lightning__tip-colors {
            font-size: 8px !important;
            line-height: 8.8px !important;
          }

