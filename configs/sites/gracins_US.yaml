site: gracins_US
base_url: https://www.gracins.com

browser:
  headed: false

global_screenshot_height_strategy: baseline
global_screenshot_scroll_passes: 3
global_screenshot_height_stable_checks: 4

screenshot_css:
  - |
    html {
      scrollbar-width: none !important;
    }
    html::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    .react-responsive-modal-root {
      display: none !important;
    }
    .announcement--carousel .announcement__carousel-item {
      opacity: 0 !important;
    }
    .announcement--carousel .announcement__carousel-item[data-slider-index="0"] {
      opacity: 1 !important;
    }

dynamic_hide:
  selectors:
    - ".price"
    - ".product__price"
    - ".product-single__price"
    - "[class*='price']"
    - ".sale-badge"
    - ".card__badge"
    - "[class*='sale-badge']"
    - "[class*='product-sale']"
    - ".jdgm-widget"
    - ".jdgm-preview-badge"
    - ".jdgm-rev-widg"
    - ".jdgm-carousel-wrapper"
    - "[id*='judgeme']"
    - "[class*='jdgm']"
    - "[class*='judge']"
    - ".spr-badge"
    - ".shopify-payment-button"
    - ".shopify-payment-button__button"
    - "[data-shopify='payment-button']"
    - "shopify-payment-terms"
    - ".product-recommendations"
    - "[id*='recommend']"
    - "[class*='recommend']"
    - "[id*='related']"
    - "[class*='related-products']"
    - "[class*='recently']"
    - ".ecomsend__Modal"
    - "[class*='ecomsend']"
    - "[id*='newsletter']"
    - "[class*='newsletter']"
    - "[id*='popup']"
    - "[class*='popup']"
    - "[id*='chat']"
    - "[class*='chat']"
    - "[id*='tidio']"
    - "[class*='tidio']"
    - "[id*='gorgias']"
    - "[class*='gorgias']"
    - "[id*='intercom']"
    - "[class*='intercom']"
    - "iframe[src*='tidio']"
    - "iframe[src*='gorgias']"
    - "iframe[src*='intercom']"
  text_exact:
    - frequently bought together
    - more payment options
    - buy it now
    - write a review
  text_contains:
    - pay with paypal
    - afterpay
    - as low as
    - added to cart
    - cart error
    - sold out
    - customer reviews

pages:
  home:
    url: https://www.gracins.com/
    capture_global_screenshot: true
    capture_first_screen: true
    stable_banner_index: 0
    stable_display:
      - selector: ".announcement--carousel .announcement__carousel-item"
        index: 0
        display: block
    dynamic_hide:
      replace_defaults: true
      selectors:
        - ".shopify-payment-button"
        - ".shopify-payment-button__button"
        - "[data-shopify='payment-button']"
        - "shopify-payment-terms"
        - ".product-recommendations"
        - "[id*='recommend']"
        - "[class*='recommend']"
        - "[id*='related']"
        - "[class*='related-products']"
        - "[class*='recently']"
        - ".ecomsend__Modal"
        - "[class*='ecomsend']"
        - "[id*='newsletter']"
        - "[class*='newsletter']"
        - "[id*='popup']"
        - "[class*='popup']"
        - "[id*='chat']"
        - "[class*='chat']"
        - "[id*='tidio']"
        - "[class*='tidio']"
        - "[id*='gorgias']"
        - "[class*='gorgias']"
        - "[id*='intercom']"
        - "[class*='intercom']"
        - "iframe[src*='tidio']"
        - "iframe[src*='gorgias']"
        - "iframe[src*='intercom']"
      text_exact:
        - frequently bought together
        - more payment options
        - buy it now
      text_contains:
        - pay with paypal
        - afterpay
        - as low as
        - added to cart
        - cart error
        - sold out
    first_screen_clip:
      x: 0
      y: 0
      width: 1600
      height: 900
    expected_keywords:
      - gracins
    modules:
      header_1:
        - xpath
        - "(//*[contains(@class, 'shopify-section-group-header-group')])[1]"
      header_2:
        - xpath
        - "(//*[contains(@class, 'shopify-section-group-header-group') and contains(@class, 'wau--header')])[1]"
      banner:
        - xpath
        - "//*[contains(@class,'slideshow__slide') and contains(@class,'is-selected')]"
      collections:
        - xpath
        - "(//*[@id='main-content']//section[contains(@class,'image__gallery-section')])[1]"
      collections_1:
        - xpath
        - "(//*[@id='main-content']//section[contains(@class,'featured__collection')])[1]"
      cart_btn:
        - css
        - "button.js-mini-cart-trigger"
    readonly_interactions:
      mobile_menu:
        trigger:
          - css
          - "button[popovertarget='slideout-mobile-navigation'][popovertargetaction='show']"
        panel:
          - css
          - "#slideout-mobile-navigation"
        close:
          - css
          - "#slideout-mobile-navigation button[popovertargetaction='hide']"
        dismiss_obstruction:
          - css
          - ".ecomsend__Modal__CloseButton[aria-label='No, thanks']"
    dom_presence:
      mobile_navigation_drawer:
        - css
        - "#slideout-mobile-navigation"
      ajax_cart_drawer:
        - css
        - "#slideout-ajax-cart"
      search_sidebar:
        - css
        - ".sidebar__search-container"
      hidden_mega_menu:
        - css
        - ".gm-submenu"
    mobile:
      first_screen_clip:
        x: 0
        y: 0
        width: 390
        height: 844

