site: mondressy_US

browser:
  headed: false

global_screenshot_height_strategy: baseline
global_screenshot_scroll_passes: 3
global_screenshot_height_stable_checks: 4

dynamic_hide:
  selectors:
    - ".price"
    - ".sale-badge"
    - ".spr-badge"
    - "#size_error"
    - ".alr-wh-rw-popup"
    - ".cbb-frequently-bought-container"
    - "[id*='cbb']"
    - "[class*='cbb']"
    - "[id*='frequently']"
    - "[class*='frequently']"
    - "[id*='bought']"
    - "[class*='bought']"
    - ".shopify-payment-button"
    - ".shopify-payment-button__button"
    - "[data-shopify='payment-button']"
    - "shopify-payment-terms"
  text_exact:
    - frequently bought together
    - more payment options
    - buy it now
  text_contains:
    - pay with paypal
    - afterpay
    - as low as

global_screenshot_hide_selectors:
  - ".alireviews-review-star-rating"
  - "[id*='alireviews']"
  - "[class*='alireviews']"
  - "[id*='alr-']"
  - "[class*='alr-']"

pages:
  home:
    url: https://www.mondressy.com
    capture_global_screenshot: true
    capture_first_screen: true
    stable_banner_index: 0
    desktop:
      first_screen_clip:
        x: 0
        y: 0
        width: 1600
        height: 900
    expected_keywords:
      - mondressy
    modules:
      header_1:
        - xpath
        - "(//*[contains(@class, 'header-group')])[1]"
      header_2:
        - xpath
        - "(//*[contains(@class, 'header-group')])[2]"
      banner:
        - xpath
        - "//*[contains(@class,'slideshow__slide') and contains(@class,'is-selected')]"
      collections:
        - xpath
        - "(//*[contains(@class, 'shopify-section index-section')])[2]"
      collections_1:
        - xpath
        - "(//*[contains(@class, 'shopify-section index-section')])[3]"
      user_btn:
        - xpath
        - "//*[contains(@class, 'icon icon-user')]"
      cart_btn:
        - xpath
        - "//*[contains(@class, 'icon icon-bag-minimal')]"
      search_btn:
        - xpath
        - "//*[contains(@class, 'site-nav small--hide')]"
    plugins:
      wishlist:
        - xpath
        - "//button[@aria-label='Open Wishlist Details']"
      currency:
        - xpath
        - "//*[@id='wssccSelected']"
    mobile:
      modules:
        search_btn:
          - css
          - ".js-search-header.medium-up--hide"

  collection:
    url: https://www.mondressy.com/collections/wedding-guest-dresses
    capture_global_screenshot: true
    capture_first_screen: true
    desktop:
      first_screen_clip:
        x: 0
        y: 0
        width: 1600
        height: 900
    expected_keywords:
      - wedding
    expected_count: 40
    modules:
      product_grid:
        - xpath
        - "//*[contains(@id,'shopify-section-template-color_collection')]"
      filter:
        - xpath
        - "(//*[contains(@class,'collection-filter')])[1]"
      pagination:
        - xpath
        - "//*[contains(@class,'pagination')]"
    product_card:
      - css
      - ".grid__item.grid-product"

  product:
    url: https://www.mondressy.com/products/a-line-princess-sleeveless-tea-length-wedding-guest-dresses-mon2311613
    capture_global_screenshot: true
    capture_first_screen: true
    desktop:
      first_screen_clip:
        x: 0
        y: 0
        width: 1600
        height: 900
    expected_keywords:
      - dress
    require_reviews: false
    modules:
      gallery:
        - xpath
        - "//*[contains(@class,'product__photos')]"
      info:
        - xpath
        - "//*[contains(@class,'product-single__meta')]"
      add_to_cart:
        - xpath
        - "//button[@name='add']"
    variant_inputs:
      - xpath
      - "//*[contains(@class,'variant')]//input"
    variant_gallery_options:
      - xpath
      - "//*[self::a or self::button][(contains(@class,'product__thumb') or contains(@class,'product-single__thumbnail')) and not(contains(@class,'product__thumb-arrow'))]"
