site: mondressy_US
base_url: https://mondressy.com
signed_request_hosts:
  - mondressy.com

browser:
  headed: false

global_screenshot_height_strategy: baseline
global_screenshot_scroll_passes: 3
global_screenshot_height_stable_checks: 4

screenshot_css:
  - |
    html {
      scrollbar-width: none !important;
    }
    html::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

dynamic_hide:
  selectors:
    - ".price"
    - ".sale-badge"
    - ".spr-badge"
    - "#size_error"
    - ".alr-wh-rw-popup"
    - ".cbb-frequently-bought-container"
    - "[id*='cbb']"
    - "[class*='cbb']"
    - "[id*='frequently']"
    - "[class*='frequently']"
    - "[id*='bought']"
    - "[class*='bought']"
    - ".shopify-payment-button"
    - ".shopify-payment-button__button"
    - "[data-shopify='payment-button']"
    - "shopify-payment-terms"
  text_exact:
    - frequently bought together
    - more payment options
    - buy it now
  text_contains:
    - pay with paypal
    - afterpay
    - as low as

global_screenshot_hide_selectors:
  # This Shopify section is populated with changing recommendations. Use its
  # stable theme-section suffix instead of its last-sibling position, which
  # differs between desktop and mobile markup.
  - "[id$='__featured_collection_bxwFEC']"
  - ".alireviews-review-star-rating"
  - "[id*='alireviews']"
  - "[class*='alireviews']"
  - "[id*='alr-']"
  - "[class*='alr-']"

pages:
  home:
    url: https://mondressy.com
    capture_global_screenshot: true
    capture_first_screen: true
    stable_banner_index: 0
    desktop:
      first_screen_clip:
        x: 0
        y: 0
        width: 1600
        height: 900
    expected_keywords:
      - mondressy
    modules:
      header_1:
        - xpath
        - "(//*[contains(@class, 'header-group')])[1]"
      header_2:
        - xpath
        - "(//*[contains(@class, 'header-group')])[2]"
      banner:
        - xpath
        - "//*[contains(@class,'slideshow__slide') and contains(@class,'is-selected')]"
      collections:
        - xpath
        - "(//*[contains(@class, 'shopify-section index-section')])[2]"
      collections_1:
        - xpath
        - "(//*[contains(@class, 'shopify-section index-section')])[3]"
      user_btn:
        - xpath
        - "//*[contains(@class, 'icon icon-user')]"
      cart_btn:
        - xpath
        - "//*[contains(@class, 'icon icon-bag-minimal')]"
      search_btn:
        - xpath
        - "//*[contains(@class, 'site-nav small--hide')]"
    plugins:
      wishlist:
        - xpath
        - "//button[@aria-label='Open Wishlist Details']"
      currency:
        - xpath
        - "//*[@id='wssccSelected']"
    size_tolerance:
      currency:
        width_px: 2
        height_px: 2
        ratio: 0.03
    dynamic_regions:
      - name: collections
        module: collections
        strategy: mask_content
        region_type: category_carousel
        item_selector: ".grid__item"
        masks:
          - "img"
          - ".collection-item__title"
          - "[class*='collection'][class*='title']"
      - name: collections_1
        module: collections_1
        strategy: mask_content
        region_type: product_carousel
        item_selector: ".grid__item.grid-product"
        masks:
          - "img"
          - ".grid-product__title"
          - ".grid-product__price"
          - ".grid-product__tag"
    layout_checks:
      collections:
        minimum_count: 1
        check_overlap: true
        check_uniform_width: true
        check_image_visible: true
        minimum_image_success_rate: 0.9
        check_horizontal_overflow: true
        check_title_present: true
        check_price_present: false
      collections_1:
        minimum_count: 1
        check_overlap: true
        check_uniform_width: true
        check_image_visible: true
        minimum_image_success_rate: 0.9
        check_horizontal_overflow: true
        check_title_present: true
        check_price_present: true
    mobile:
      modules:
        search_btn:
          - css
          - ".js-search-header.medium-up--hide"

  collection:
    url: https://mondressy.com/collections/wedding-guest-dresses
    capture_global_screenshot: true
    capture_first_screen: true
    desktop:
      first_screen_clip:
        x: 0
        y: 0
        width: 1600
        height: 900
    expected_keywords:
      - wedding
    expected_count: 40
    modules:
      product_grid:
        - xpath
        - "//*[contains(@id,'shopify-section-template-color_collection')]"
      filter:
        - xpath
        - "(//*[contains(@class,'collection-filter')])[1]"
      pagination:
        - xpath
        - "//*[contains(@class,'pagination')]"
    product_card:
      - css
      - ".grid__item.grid-product"
    dynamic_regions:
      - name: product_grid
        module: product_grid
        strategy: layout_only
        region_type: product_grid
        item_selector: ".grid__item.grid-product"
    layout_checks:
      product_grid:
        minimum_count: 1
        check_overlap: true
        check_uniform_width: true
        check_reasonable_height: true
        check_image_visible: true
        minimum_image_success_rate: 0.9
        check_horizontal_overflow: true
        check_title_present: true
        check_price_present: true
    content_change:
      allowed:
        - product_count
        - product_order
        - product_title
        - product_price
        - product_image
        - availability

  product:
    url: https://mondressy.com/products/a-line-princess-sleeveless-tea-length-wedding-guest-dresses-mon2311613
    capture_global_screenshot: true
    capture_first_screen: true
    desktop:
      first_screen_clip:
        x: 0
        y: 0
        width: 1600
        height: 900
    expected_keywords:
      - dress
    require_reviews: false
    monitoring_product:
      stable: true
    modules:
      gallery:
        - xpath
        - "//*[contains(@class,'product__photos')]"
      info:
        - xpath
        - "//*[contains(@class,'product-single__meta')]"
      add_to_cart:
        - xpath
        - "//button[@name='add']"
    dynamic_regions:
      - name: info
        module: info
        strategy: mask_content
        masks:
          - ".product-single__title"
          - ".product__price"
          - ".product__inventory"
          - "[class*='review']"
          - "[class*='countdown']"
    variant_inputs:
      - xpath
      - "//*[contains(@class,'variant')]//input"
    variant_gallery_options:
      - xpath
      - "//*[self::a or self::button][(contains(@class,'product__thumb') or contains(@class,'product-single__thumbnail')) and not(contains(@class,'product__thumb-arrow'))]"
