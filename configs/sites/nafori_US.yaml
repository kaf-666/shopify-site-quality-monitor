site: nafori_US
base_url: https://www.nafori.com

browser:
  headed: true

global_screenshot_height_strategy: baseline
global_screenshot_scroll_passes: 3
global_screenshot_height_stable_checks: 4

access_denied_patterns:
  - Performing security verification
  - security service to protect against malicious bots
  - malicious bots

screenshot_css:
  - |
    .announcement-bar__message,
    .announcement-bar__message p {
      animation: none !important;
      transition: none !important;
    }
    .slideshow__slide {
      transition: none !important;
    }
    .slideshow__slide:not(.is-selected) {
      opacity: 0 !important;
    }
    .slideshow__slide.is-selected {
      opacity: 1 !important;
    }
    @media screen and (max-width: 980px) {
      .announcement-bar__wrapper .announcement-bar_container {
        transform: none !important;
      }
      .announcement-bar__wrapper .announcement-bar__message {
        display: none !important;
        transform: none !important;
      }
      .announcement-bar__wrapper .announcement-bar__message:first-of-type {
        display: flex !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

dynamic_hide:
  selectors:
    - ".price"
    - ".product__price"
    - ".product-single__price"
    - "[class*='price']"
    - ".sale-badge"
    - ".card__badge"
    - "[class*='sale-badge']"
    - "[class*='product-sale']"
    - ".jdgm-widget"
    - ".jdgm-preview-badge"
    - ".jdgm-rev-widg"
    - ".jdgm-carousel-wrapper"
    - "[id*='judgeme']"
    - "[class*='jdgm']"
    - "[class*='judge']"
    - ".spr-badge"
    - ".shopify-payment-button"
    - ".shopify-payment-button__button"
    - "[data-shopify='payment-button']"
    - "shopify-payment-terms"
    - ".product-recommendations"
    - "[id*='recommend']"
    - "[class*='recommend']"
    - "[id*='related']"
    - "[class*='related-products']"
    - "[class*='recently']"
    - ".ecomsend__Modal"
    - "[class*='ecomsend']"
    - "[id*='newsletter']"
    - "[class*='newsletter']"
    - "[id*='popup']"
    - "[class*='popup']"
    - "[id*='chat']"
    - "[class*='chat']"
    - "[id*='tidio']"
    - "[class*='tidio']"
    - "[id*='gorgias']"
    - "[class*='gorgias']"
    - "[id*='intercom']"
    - "[class*='intercom']"
    - "iframe[src*='tidio']"
    - "iframe[src*='gorgias']"
    - "iframe[src*='intercom']"
  text_exact:
    - frequently bought together
    - more payment options
    - buy it now
    - write a review
  text_contains:
    - pay with paypal
    - afterpay
    - as low as
    - added to cart
    - cart error
    - sold out
    - customer reviews

